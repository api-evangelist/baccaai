aid: baccaai
name: Bacca.ai
description: 'Bacca.ai is an AI-driven Site Reliability Engineering (SRE) platform that
  deploys an autonomous agent functioning as a Tier-1 on-call engineer. It ingests operational
  context from Slack, Jira, documentation, logs, traces, and metrics to build a proprietary
  Knowledge Graph of an organization''s systems, then contextualizes and deduplicates
  alerts, identifies root causes with high accuracy, automates incident war rooms and
  post-mortem generation, and surfaces reports on system failures and hotspots. Bacca
  reports cutting Mean Time To Resolution (MTTR) by roughly 40-60%. Founded in 2023 and
  headquartered in San Francisco, the company deploys on Google Cloud (cloud or on-prem)
  with single-tenant data isolation and SOC 2 Type I & II attestation. Backed by Homebrew.'
